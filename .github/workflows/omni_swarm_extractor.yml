name: Omni-Swarm Extractor Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Ejecuta todos los dias a las 3:00 AM (UTC)

jobs:
  run-extractor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Omni-Swarm Extractor
        run: python scripts_leviathan/13_omni_swarm_extractor_stub.py
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: data/extracted/
